/* Short, monochrome feedback; no overlay fade can cover live combat. */
button,summary{transition:translate .12s ease,scale .12s ease,background-color .16s ease,border-color .16s ease,box-shadow .16s ease}
button:not(:disabled):active,summary:active{translate:0 2px;scale:.97;box-shadow:inset 0 2px 0 #0004}
.panel[data-motion]:not([data-motion=still]){animation:panel-enter .4s cubic-bezier(.2,.7,.2,1) both}
.panel[data-motion=supply]{animation:reward-enter .5s cubic-bezier(.2,.8,.25,1) both}
.panel[data-motion=supply] .crate-art{animation:reward-icon .55s cubic-bezier(.2,.8,.25,1) both}
.panel[data-motion=supply] .reward-box{animation:panel-enter .3s .15s both}
.panel[data-motion=upgrade] .choice-group{animation:panel-enter .28s both}
.panel[data-motion=upgrade] .choice-group:nth-of-type(3){animation-delay:.04s}
.panel[data-motion=upgrade] .choice-group:nth-of-type(4){animation-delay:.08s}
details[open]>.set-entry,details[open]>p,.card-recipe[open]>div{animation:detail-enter .2s ease-out both}
.flight-enter{animation:flight-enter .3s ease-out both}
.tap-mark{position:fixed;z-index:1000;width:20px;height:20px;margin:-10px;border:2px solid white;outline:1px solid #333;pointer-events:none;animation:tap-mark .32s ease-out both}
@keyframes panel-enter{from{opacity:.25;translate:0 10px}to{opacity:1;translate:0 0}}
@keyframes reward-enter{from{opacity:.3;scale:.95;translate:0 10px}to{opacity:1;scale:1;translate:0 0}}
@keyframes reward-icon{0%{scale:.65;rotate:-8deg}65%{scale:1.12;rotate:3deg}100%{scale:1;rotate:0deg}}
@keyframes detail-enter{from{opacity:0;translate:0 -4px}to{opacity:1;translate:0 0}}
@keyframes flight-enter{from{opacity:.65;scale:1.025}to{opacity:1;scale:1}}
@keyframes tap-mark{from{opacity:.9;scale:.5;rotate:0deg}to{opacity:0;scale:2;rotate:45deg}}
@media(prefers-reduced-motion:reduce){button,summary{transition:none}button:not(:disabled):active,summary:active{translate:none;scale:1}.panel[data-motion],.panel[data-motion] .crate-art,.panel[data-motion] .reward-box,.panel[data-motion] .choice-group,details[open]>.set-entry,details[open]>p,.card-recipe[open]>div,.flight-enter{animation:none!important}.tap-mark{display:none}}

.reward-lines{background:#fff;border:2px solid #111;text-align:left;margin:14px 0}.reward-lines div{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;font-size:14px;border-bottom:1px solid #ddd}.reward-lines b{font-family:ui-monospace,monospace;font-size:16px}.reward-lines .total{background:#111;color:#fff;border:0}.end-gear{margin:14px 0;text-align:left}.end-gear>small{display:block;font-size:12px;font-weight:700;color:#333;margin-bottom:6px}
/* Supply crate: shake, burst, then a high-contrast reward card. */
.free-box{margin:16px 0 0}.crate-stage{position:relative;height:170px;display:grid;place-items:center;overflow:hidden}.crate-svg{position:relative;z-index:1;width:116px;height:106px;fill:#111;shape-rendering:crispEdges;overflow:visible}.crate-lid{transform-box:fill-box;transform-origin:50% 100%}.crate-stage.idle .crate-svg{animation:crate-bob 1.6s ease-in-out infinite}.crate-stage.shaking .crate-svg{animation:crate-shake .16s linear infinite}.crate-stage.shaking.hard .crate-svg{animation-duration:.08s}.crate-stage.opening .crate-lid{animation:lid-off .55s cubic-bezier(.2,.7,.3,1) forwards}.crate-stage.opening .crate-body{transform-box:fill-box;transform-origin:50% 100%;animation:crate-pop .3s ease-out}.crate-rays{position:absolute;left:50%;top:50%;width:340px;height:340px;margin:-170px;background:repeating-conic-gradient(#111 0 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 64%);mask:radial-gradient(circle,#000 18%,transparent 64%);opacity:0}.crate-stage.opening .crate-rays{animation:rays .7s ease-out forwards}.crate-hint{text-align:center;color:#555}

.reward-extra{display:flex;justify-content:space-between;gap:8px;background:#fff;border:1px solid #999;padding:10px 12px;margin-top:10px;font-size:13px;text-align:left}.supply-cost{font-size:12px;color:#444;margin:10px 0 4px;text-align:center}

#reverse{position:absolute;right:10px;bottom:10px;z-index:2;width:60px;height:60px;padding:0;display:flex;align-items:center;justify-content:center;border:2px solid #666;background:linear-gradient(to top,#4a4a4a var(--g,0%),#0d0d0d var(--g,0%));color:#9a9a9a;font-size:13px;font-weight:700;opacity:.8;touch-action:none}

MONO FLIGHT — Claude handoff / 2026-10-30
Single HTML plus fonts/ (Galmuri11 regular/bold, OFL). No libraries, images, network or build step.
Light armor reduces the player collision radius 8–20% by level; no movement speed bonus. Touch drag is 1:1 in screen space.
Open in a modern browser. Audio starts after user interaction.
Sections: CSS; audio.js (synthesized music/SFX); meta.js (save, gear, crates);
sets.js (A–D combinations); game.js (canvas combat); ui.js (dialogs/feedback).
Progress is browser-local (plus optional Firebase cloud save, see FB_CONFIG / cloudSync): mono-flight-progress-v1, schema version 3 (v2 cleared stage n -> chapter n cleared).
Progress from the hosted website is NOT transferred into this file.
Design: monochrome pixel graphics, hostile bullets red; readable short Korean UI.
3 hearts; vertical auto-fire, drag/WASD/arrows; ESC pauses.
Title screen (state 'intro') shows once per launch; the first tap unlocks audio and plays a short fanfare.
Music (SONG_DEFS): procedural 16-bar A/B songs per chapter, a boss theme, three calm hangar tracks that rotate after each run, and an ending track. Battle layers build up: drums/bass -> arp at 12s -> melody at 35s -> busier drums with elites; a pad joins once 3+ colours are restored.
Enemy descent speed x1.1 x H/448 and enemy bullets x(1+(H/448-1)/2), so taller screens keep the same pace (cfg.spd, cfg.bspd).
Playfield is 288 wide; height H adapts to the screen between 448 and 640 (fitScreen), fixed during a run. On phones (<=760px) the game is full-bleed: HUD, XP bar and set chips float over the canvas; sound toggles live in pause and settings.
30 stages in 6 chapters (CHAPTERS). Stage n-1..n-4: 90 sec then an elite; n-5: boss at 150 sec. Cleared stages are replayable at half reward.
Stars: clear / 2+ hearts / no damage, 20 parts each; 15 chapter stars give one free crate.
Chapter 1 beginner tuning: no shots for 8 sec in 1-1; hit invulnerability 1.4 sec; no rushers; boss HP 300 with no radial volleys. All enemy HP ×1.2 (fractional), elite HP 70×chapter multiplier.
9 permanent gear items (3 per slot) with stars 1-3 (GEAR.stars); star 3 includes the former mod. Upgrade directly for 300/800 parts or open a 150-part crate for a random star on owned gear. New gear comes from first boss clears (BOSS_GEAR). Save schema 4 maps old Lv1-2/3-4/5+mod to stars 1/2/3.
Each gear item has its own mod in MODS keyed by item ID; saved per-item mod flags remain compatible.
Crates cost 100 + 20 per prior opening, capped at 300; one parts currency; legacy tickets migrate.
Unknown gear uses ? cards. Known cards show pixel icons; click opens gear dialog.
Graze: enemy bullets passing within 14px of the hitbox fill a 0-100 gauge (4, boss 6); #reverse / Space converts all enemy bullets into homing player shots and inverts the canvas for 0.45 sec.
Colours: each first boss clear restores one muted colour (COLOR_STEPS, PAL); red stays reserved for enemy bullets; progress.mono keeps everything monochrome.
Hit feel: hitStop freezes update briefly (kills, player hit), knockback, 2px main shots with tail, muzzle flash, pop/ring effects, vibration follows the SFX toggle; SFX default on (audio prefs sfxV:2).
Boss gimmicks: 1 wing turrets (parts with wing flag, optional; breaking one silences that side and deals 6%); 2 eye opens/shuts (eyeState, x2 / x0.25 damage) + side gusts (windX pushes player and bullets); 3 darkness after turrets die (darkA, light circle around player, core flash every 6s); 4 three engines (engine parts: sides launch fighters, centre fires columns, burn effect strips stay 2.2s; body takes 15% until all die); 5 rotating reflect face (faceA, shots there bounce back as bullets); 6 steals colours every 6-8s (stolenColors, -12% damage each, reversal returns one) and phase 3 inverts the screen (invertOn).
Bosses 4-6: Ash Flagship launches fighters and fires telegraphed columns (warn effect, boss.queue); Frost Crystal splits into 3 orbiting shard parts at 50% (core takes 20% until they die); Monochrome has 3 phases with pixel rain and 'reverse' that turns player shots into slow enemy bullets. Final first clear plays all colour waves and an ending card.
Bosses 1-3 use BOSS_ART + bossFire(): Iron Wing alternates nose fans and wing-tip turrets; Eye of the Storm fires rotating rings with a 3-bullet gap; Black Core takes 35% damage until its two 'part' turrets die.
New foes by chapter (pickNewFoe): turret ch3+ (stops, 3-shot burst), mine ch4+ (8-way burst on death or near the bottom), shield ch5+ (blocks straight player shots from below), splitter ch6+ (splits into two minis). First sighting shows a one-time notice (progress.tips.foe_*).
Waves (spawnFormation -> WAVES): v and line from ch1; side sweeps ch2+; orbit rings and telegraphed rise-from-below ch3+. Delayed spawns go through waveQ/later(). Sniper ch4-3+: locks a red line for 0.9 sec, then one fast shot.
Chapter elites (ELITE_ART, eliteMove, eliteFire): 1 leader with two escorts, 2 dash captain (aim line then charge), 3 three-barrel turret, 4 mine layer, 5 rotating arc shield, 6 shadow that fades out (untargetable) and reappears with a ring.
Abilities (16): sets A lightning/wing/rapid, B blast/ricochet/spread, C drone/pulse/satellite, D laser/focus(pierce)/overcharge, E grazeup/warhead/afterimage; repair is setless. Set changes play setBanner + hit stop + rings.
Difficulty: non-aimed patterns (line waves fire straight down, side waves fire diagonals, some basics fire down from ch2, tanks add rings ch3+ and gap fans ch4+), normal fire rate x0.87 interval, repair max 2 per run, satellites recharge 1.5 sec after a block, enemy/elite/boss HP grow with run level.
Onboarding: 1-1 has no reverse (button, graze, E abilities) and 1-1/1-2 have no sets, even on replays (cfg.feat); the gear tab unlocks on first clear of 1-5 with one free crate.
Ultimates (ULTS): once a set is complete its ultimate card can appear (max one per run). One reroll per run on level-up cards.
Stage themes (STAGE_THEMES): each normal stage has featured enemies/waves (spawn bias ~45%, themed waves 70% and more frequent) and a matching scene on the stage card.
Run abilities reset on departure. Automatic A–D pair/full set effects.
Menus use native dialog popups; no inline expanding help.
IMPORTANT: keep #overlay[hidden] display:none and clear it during hidePanel(),
or an invisible menu layer can darken combat and intercept touch.
Maintain scroll position on equipment changes. Do not reset saved progress.

// Feedback is visual only: it never delays an action or intercepts input.
document.addEventListener('click',event=>{
  const control=event.target.closest('button,summary');
  if(!control||control.disabled)return;
  control.animate([{boxShadow:'inset 0 0 0 3px #888'},{boxShadow:'inset 0 0 0 0px #888'}],{duration:400});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const box=control.getBoundingClientRect();

  mark.className='tap-mark';
  mark.setAttribute('aria-hidden','true');
  mark.style.left=(event.detail?event.clientX:box.left+box.width/2)+'px';
  mark.style.top=(event.detail?event.clientY:box.top+box.height/2)+'px';
